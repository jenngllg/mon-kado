# Install as /etc/systemd/system/caddy.service.d/monkado.conf.
# Caddy receives only host/static-path settings, never API credentials.
[Service]
EnvironmentFile=/etc/monkado/caddy.env
ExecStart=
ExecStart=/usr/bin/caddy run --config /opt/monkado/deployments/caddy/Caddyfile --adapter caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /opt/monkado/deployments/caddy/Caddyfile --adapter caddyfile --force
Slice=monkado.slice
