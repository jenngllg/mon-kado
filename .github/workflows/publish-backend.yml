name: Publish approved backend

on:
  workflow_dispatch:
    inputs:
      rollback_allowed:
        description: 'Previous application remains compatible with files and data written by this release (unchanged schema only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-production-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require production protection and green checks for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'jenngllg/mon-kado'
          gh api "repos/$GITHUB_REPOSITORY/environments/production" \
            --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' | grep -x true
          for workflow in ci.yml codeql.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&branch=develop&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | sort_by(.run_number) | last | .conclusion' \
              | grep -x success
          done
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CodeQL")] | sort_by(.started_at) | last | .conclusion' | grep -x success
      - name: Set up native Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Scan reachable native dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build immutable native Linux binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-release"
          for component in api worker migrate; do
            go build -trimpath -ldflags="-s -w -X github.com/JennGllg/mon-kado/internal/buildinfo.Revision=$GITHUB_SHA" \
              -o "$RUNNER_TEMP/native-release/monkado-$component-linux-amd64" "./cmd/$component"
            "$RUNNER_TEMP/native-release/monkado-$component-linux-amd64" --version \
              | jq -e --arg revision "$GITHUB_SHA" '.schemaVersion == 1 and .revision == $revision and .os == "linux" and .architecture == "amd64"'
          done
          "$RUNNER_TEMP/native-release/monkado-migrate-linux-amd64" --catalog > "$RUNNER_TEMP/native-release/migration-catalog.json"
          python3 src/Operations.Deployment/release_catalog.py internal/persistence/migrations > "$RUNNER_TEMP/source-catalog.json"
          jq -S . "$RUNNER_TEMP/source-catalog.json" > "$RUNNER_TEMP/source-catalog.sorted.json"
          jq -S . "$RUNNER_TEMP/native-release/migration-catalog.json" > "$RUNNER_TEMP/binary-catalog.sorted.json"
          cmp "$RUNNER_TEMP/source-catalog.sorted.json" "$RUNNER_TEMP/binary-catalog.sorted.json"
          (cd "$RUNNER_TEMP/native-release" && sha256sum monkado-*-linux-amd64 migration-catalog.json > SHA256SUMS)
      - name: Publish approved immutable artifacts and promotion pointer
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_ALLOWED: ${{ inputs.rollback_allowed }}
        shell: bash
        run: |
          set -euo pipefail
          configuration_hash=$(python3 deployments/production/release_manifest.py hash)
          export CONFIGURATION_HASH="$configuration_hash"
          export PUBLICATION_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export RELEASE_TAG="backend-$GITHUB_SHA-$PUBLICATION_ID"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          sys.path[:0] = ['src/Operations.Deployment', 'deployments/production']
          from release_catalog import fingerprint
          from release_manifest import validate
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-release'
          catalog = json.loads((root / 'migration-catalog.json').read_bytes())
          binaries = {}
          for component in ('api', 'worker', 'migrate'):
              name = f'monkado-{component}-linux-amd64'
              body = (root / name).read_bytes()
              binaries[component] = {
                  'url': f'https://github.com/jenngllg/mon-kado/releases/download/{os.environ["RELEASE_TAG"]}/{name}',
                  'sha256': hashlib.sha256(body).hexdigest(), 'size': len(body)}
          manifest = {'schemaVersion': 3, 'revision': os.environ['GITHUB_SHA'],
              'configurationHash': os.environ['CONFIGURATION_HASH'], 'publicationId': os.environ['PUBLICATION_ID'],
              'migrationCatalog': catalog, 'migrationHash': fingerprint(catalog),
              'rollbackAllowed': os.environ['ROLLBACK_ALLOWED'] == 'true', 'binaries': binaries}
          validate(manifest, os.environ['CONFIGURATION_HASH'])
          (root / 'backend-manifest.json').write_text(json.dumps(manifest, sort_keys=True), encoding='utf-8')
          PY
          # Never overwrite assets on an immutable publication tag.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Native backend $PUBLICATION_ID" --notes-file "$RUNNER_TEMP/native-release/backend-manifest.json" \
            --latest=false "$RUNNER_TEMP/native-release/"*
          # Move the approved channel only after all immutable artifacts were published.
          if gh release view backend-production --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit backend-production --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/native-release/backend-manifest.json" --latest=false
          else
            gh release create backend-production --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Approved native backend production release' --notes-file "$RUNNER_TEMP/native-release/backend-manifest.json" --latest=false
          fi
          echo 'Native binaries published. This job does not confirm a successful VPS rollout.' >> "$GITHUB_STEP_SUMMARY"
