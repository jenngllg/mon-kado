version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      microsoft-dotnet:
        patterns:
          - Microsoft.*
          - Npgsql*
          - EFCore.*
      test-tooling:
        patterns:
          - coverlet.*
          - Testcontainers.*
          - xunit*
    ignore:
      - dependency-name: MediatR
        versions:
          - ">= 13.0.0"
      - dependency-name: Microsoft.OpenApi
        versions:
          - ">= 3.0.0"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: dotnet-sdk
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      dotnet-images:
        patterns:
          - mcr.microsoft.com/dotnet/*

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      runtime-images:
        patterns:
          - "*"
