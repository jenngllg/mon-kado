name: mon-kado

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  ConnectionStrings__PostgreSql: >-
    Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};SSL Mode=Disable;GSS Encryption Mode=Disable;Include Error Detail=false

x-app-security: &app-security
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    logging: *default-logging

  migrations:
    image: mon-kado-api:${IMAGE_TAG:-local}
    environment:
      <<: *app-environment
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/dotnet-bundle
      AllowedHosts: ${API_ALLOWED_HOST:?Set API_ALLOWED_HOST in .env}
      WebSecurity__AllowedOrigins__0: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      WishlistSharing__FrontendOrigin: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      DataProtection__KeysPath: /tmp/data-protection-keys
    entrypoint:
      - /app/efbundle
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend
    logging: *default-logging
    <<: *app-security

  api:
    image: mon-kado-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *app-environment
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      GoogleAuthentication__Enabled: ${GOOGLE_AUTHENTICATION_ENABLED:-false}
      GoogleAuthentication__ClientId: ${GOOGLE_AUTHENTICATION_CLIENT_ID:-}
      GoogleAuthentication__ClientSecret: ${GOOGLE_AUTHENTICATION_CLIENT_SECRET:-}
      GoogleAuthentication__BackchannelTimeoutSeconds: ${GOOGLE_AUTHENTICATION_BACKCHANNEL_TIMEOUT_SECONDS:-15}
      GoogleAuthentication__FrontendOrigin: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      ReverseProxy__KnownNetworks__0: ${EDGE_NETWORK_CIDR:-172.30.0.0/24}
      ASPNETCORE_HTTP_PORTS: "8080"
      AllowedHosts: ${API_ALLOWED_HOST:?Set API_ALLOWED_HOST in .env}
      WebSecurity__AllowedOrigins__0: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      WishlistSharing__FrontendOrigin: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      DataProtection__KeysPath: /var/lib/mon-kado/data-protection-keys
      GiftImages__StoragePath: /var/lib/mon-kado/gift-images
    expose:
      - "8080"
    volumes:
      - data_protection_keys:/var/lib/mon-kado/data-protection-keys
      - gift_images:/var/lib/mon-kado/gift-images
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - backend
      - edge
    logging: *default-logging
    <<: *app-security

  worker:
    image: mon-kado-worker:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-environment
      DOTNET_ENVIRONMENT: Production
      AuthenticationEmail__Provider: ${AUTHENTICATION_EMAIL_PROVIDER:-Gmail}
      AuthenticationEmail__FrontendOrigin: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      AuthenticationEmail__ProcessedRetentionDays: ${AUTHENTICATION_EMAIL_PROCESSED_RETENTION_DAYS:-30}
      AuthenticationEmail__DeliveryBatchSize: ${AUTHENTICATION_EMAIL_DELIVERY_BATCH_SIZE:-20}
      AuthenticationEmail__DeliveryLeaseDuration: ${AUTHENTICATION_EMAIL_DELIVERY_LEASE_DURATION:-00:02:00}
      AuthenticationEmail__PollInterval: ${AUTHENTICATION_EMAIL_POLL_INTERVAL:-00:00:10}
      AuthenticationEmail__FailureRetryInterval: ${AUTHENTICATION_EMAIL_FAILURE_RETRY_INTERVAL:-00:01:00}
      AuthenticationEmail__MaximumDeliveryAttempts: ${AUTHENTICATION_EMAIL_MAXIMUM_DELIVERY_ATTEMPTS:-10}
      AuthenticationEmail__FirstRetryDelay: ${AUTHENTICATION_EMAIL_FIRST_RETRY_DELAY:-00:01:00}
      AuthenticationEmail__SecondRetryDelay: ${AUTHENTICATION_EMAIL_SECOND_RETRY_DELAY:-00:05:00}
      AuthenticationEmail__ThirdRetryDelay: ${AUTHENTICATION_EMAIL_THIRD_RETRY_DELAY:-00:15:00}
      AuthenticationEmail__FourthRetryDelay: ${AUTHENTICATION_EMAIL_FOURTH_RETRY_DELAY:-01:00:00}
      AuthenticationEmail__SubsequentRetryDelay: ${AUTHENTICATION_EMAIL_SUBSEQUENT_RETRY_DELAY:-06:00:00}
      AuthenticationEmail__SlowRetryDelay: ${AUTHENTICATION_EMAIL_SLOW_RETRY_DELAY:-06:00:00}
      AuthenticationEmail__MaximumRetryDelay: ${AUTHENTICATION_EMAIL_MAXIMUM_RETRY_DELAY:-1.00:00:00}
      AuthenticationCleanup__BatchSize: ${AUTHENTICATION_CLEANUP_BATCH_SIZE:-500}
      AuthenticationCleanup__Interval: ${AUTHENTICATION_CLEANUP_INTERVAL:-1.00:00:00}
      AuthenticationCleanup__FailureRetryInterval: ${AUTHENTICATION_CLEANUP_FAILURE_RETRY_INTERVAL:-00:15:00}
      Gmail__SenderAddress: ${GMAIL_SENDER_ADDRESS:-}
      Gmail__ClientId: ${GMAIL_CLIENT_ID:-}
      Gmail__ClientSecret: ${GMAIL_CLIENT_SECRET:-}
      Gmail__RefreshToken: ${GMAIL_REFRESH_TOKEN:-}
      Gmail__RequestTimeout: ${GMAIL_REQUEST_TIMEOUT:-00:00:15}
      DataProtection__KeysPath: /var/lib/mon-kado/data-protection-keys
      GiftImages__StoragePath: /var/lib/mon-kado/gift-images
      GiftImageCleanup__BatchSize: ${GIFT_IMAGE_CLEANUP_BATCH_SIZE:-100}
      GiftImageCleanup__Interval: ${GIFT_IMAGE_CLEANUP_INTERVAL:-00:00:30}
      GiftImageCleanup__FailureRetryInterval: ${GIFT_IMAGE_CLEANUP_FAILURE_RETRY_INTERVAL:-00:01:00}
      GiftImageCleanup__LeaseDuration: ${GIFT_IMAGE_CLEANUP_LEASE_DURATION:-00:05:00}
      GiftImageCleanup__PendingGracePeriod: ${GIFT_IMAGE_PENDING_GRACE_PERIOD:-01:00:00}
      GiftImageCleanup__MaximumRetryDelay: ${GIFT_IMAGE_MAXIMUM_RETRY_DELAY:-01:00:00}
    volumes:
      - data_protection_keys:/var/lib/mon-kado/data-protection-keys
      - gift_images:/var/lib/mon-kado/gift-images
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - backend
    logging: *default-logging
    <<: *app-security

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?Set API_HOST in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deployments/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    networks:
      - edge
    logging: *default-logging

networks:
  backend:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_NETWORK_CIDR:-172.30.0.0/24}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  data_protection_keys:
  gift_images:
