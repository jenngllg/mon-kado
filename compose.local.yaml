services:
  migrations:
    environment:
      ASPNETCORE_ENVIRONMENT: Local

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Local

  worker:
    environment:
      DOTNET_ENVIRONMENT: Local
      AuthenticationEmail__Provider: Disabled

  caddy:
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8080}:80"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
