[extend]
useDefault = true

[allowlist]
description = "Deterministic non-secret test vectors"
regexTarget = "secret"
regexes = [
  '''AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=''',
  '''c2Vuc2l0aXZlLXJlc2V0LXRva2Vu'''
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "RFC 6238 Appendix B public SHA-1 test vector, Base32 encoded"
condition = "AND"
paths = ['''^tests/Infrastructure\.Persistence\.PostgreSql\.UnitTests/Services/TwoFactorCryptographyTests\.cs$''']
regexTarget = "secret"
regexes = ['''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''']
