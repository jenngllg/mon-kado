[extend]
useDefault = true

[allowlist]
description = "Deterministic non-secret test vectors"
regexTarget = "secret"
regexes = [
  '''AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=''',
  '''c2Vuc2l0aXZlLXJlc2V0LXRva2Vu'''
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "RFC 6238 Appendix B public SHA-1 test vector, Base32 encoded"
condition = "AND"
paths = ['''^internal/security/totp_test\.go$''', '''^tests/Infrastructure\.Persistence\.PostgreSql\.UnitTests/Services/TwoFactorCryptographyTests\.cs$''']
regexTarget = "secret"
regexes = ['''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''']

[[rules.allowlists]]
description = "Historical empty catalog-key placeholder followed by the public telemetry setting name"
condition = "AND"
paths = ['''^deployments/production/production\.env\.example$''']
regexTarget = "secret"
regexes = ['''^OBSERVABILITY_ENABLED=true$''']

[[rules.allowlists]]
description = "Public API executable SHA-256 digests in the original native performance evidence"
condition = "AND"
paths = ['''^docs/performance/go-migration-native-2026-10-12\.json$''']
regexTarget = "secret"
regexes = [
  '''^bb158b286a2475cedebadef8ec3e12bb4c1fabb7b166822a8e2b0fdcf48e35a4$''',
  '''^175eaf8e824c8c615972a4664b9fb204153af906186e5bfe2d0a5f027dec3e5a$''',
  '''^f9407b8eaa792ebe52d2fab2ed79d188b91118d8a241420794eecdcef9d8563d$'''
]

[[rules.allowlists]]
description = "Public Git tree identity of the qualified native Gmail module in the one-time review"
condition = "AND"
paths = ['''^\.github/review_local_transports\.py$''']
regexTarget = "secret"
regexes = ['''^514d3ca53803cdea79e68bd0f12a799d96ce9725$''']
